<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f9faf7" />
    <title>Helsinki Live · 30 Day Map Challenge · Tileflow</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main aria-label="Helsinki bus map">
      <div id="map" aria-label="Interactive map"></div>
      <div class="map-top">
        <div class="city">
          <a
            class="hsl-brand"
            href="https://www.hsl.fi/en"
            target="_blank"
            rel="noreferrer"
            title="Helsinki Region Transport"
            ><img src="/hsl-hrt.png" alt="HSL HRT" width="62" height="24"
          /></a>
          <h1>Helsinki</h1>
          <div class="city-meta">
            <span id="live" role="status">Connecting</span
            ><time id="clock" aria-label="Helsinki local time"></time>
          </div>
        </div>
        <div class="finder" role="search">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m15.5 15.5 5 5" />
            </svg>
            <input
              id="search"
              type="search"
              aria-label="Search for a route or stop"
              placeholder="Route or stop"
              autocomplete="off"
              aria-controls="search-results"
            />
          </label>
          <div id="search-results" aria-label="Search results" hidden></div>
        </div>
        <button id="nearby" class="nearby-control" type="button">Nearby stops</button>
      </div>
      <div class="map-controls">
        <div class="nav">
          <button id="overview" title="Network overview" aria-label="Network overview">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
            </svg>
          </button>
          <button id="plus" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="minus" title="Zoom out" aria-label="Zoom out">−</button>
        </div>
      </div>
      <section id="dock" class="dock" aria-label="Transit information">
        <button
          id="fold"
          class="dock-bar"
          aria-controls="detail"
          aria-expanded="true"
          title="Collapse details"
        >
          <i id="map-key" aria-hidden="true"></i><span id="map-caption">Bus network</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <div id="detail" class="detail"></div>
      </section>
      <div id="map-error" class="map-error" role="status" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
