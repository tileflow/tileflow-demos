<!doctype html>
<html lang="en" class="loading">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sun on the street</title>
    <meta name="description" content="How much of every sidewalk is in the sun, every five minutes of every day of the year, shaded by buildings and street trees." />
    <link rel="canonical" href="https://maps.tileflow.dev/sun-on-the-street/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tileflow" />
    <meta property="og:title" content="Sun on the street" />
    <meta property="og:description" content="How much of every sidewalk is in the sun, every five minutes of every day of the year, shaded by buildings and street trees." />
    <meta property="og:url" content="https://maps.tileflow.dev/sun-on-the-street/" />
    <meta property="og:image" content="https://maps.tileflow.dev/sun-on-the-street/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A 3D map of Manhattan around the Flatiron Building, with sunlit sidewalks in amber and shaded ones in blue." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="map"></div>
    <div id="loader" role="status" aria-label="Loading the map"><span class="symbol" aria-hidden="true"><i style="--x:0.00%;--y:0.00%;--d:0ms"></i><i style="--x:37.50%;--y:0.00%;--d:45ms"></i><i style="--x:18.75%;--y:37.50%;--d:90ms"></i><i style="--x:56.25%;--y:37.50%;--d:135ms"></i><i style="--x:37.50%;--y:75.00%;--d:180ms"></i><i style="--x:75.00%;--y:75.00%;--d:225ms"></i></span></div>
    <div class="veil top" aria-hidden="true"></div>
    <div class="veil bottom" aria-hidden="true"></div>

    <header id="head" aria-live="polite">
      <div class="brand"><span class="symbol logo" aria-hidden="true"><i style="--x:0.00%;--y:0.00%;--d:0ms"></i><i style="--x:37.50%;--y:0.00%;--d:45ms"></i><i style="--x:18.75%;--y:37.50%;--d:90ms"></i><i style="--x:56.25%;--y:37.50%;--d:135ms"></i><i style="--x:37.50%;--y:75.00%;--d:180ms"></i><i style="--x:75.00%;--y:75.00%;--d:225ms"></i></span><b>Sun on the street</b></div>
      <div id="big">—</div>
      <p id="line">Following the sun…</p>
      <div id="sub"></div>
      <p id="status"></p>
    </header>

    <section id="chart" aria-label="When">
      <div class="row">
        <button id="play" type="button" aria-label="Play"><svg viewBox="0 0 8 10" aria-hidden="true"><path d="M1 .5v9L7.5 5z" /></svg></button>
        <b id="chart-title">Height of the sun</b>
        <span class="by">by</span>
        <span class="scopes" role="radiogroup" aria-label="What the map adds up">
          <button type="button" data-scope="hour" role="radio">hour</button>
          <button type="button" data-scope="day" role="radio">day</button>
          <button type="button" data-scope="month" role="radio">month</button>
        </span>
        <svg id="compass" viewBox="0 0 40 40" aria-hidden="true"></svg>
      </div>
      <svg id="bars" role="slider" tabindex="0" aria-label="Time"></svg>
      <svg id="strip" role="slider" tabindex="0" aria-label="Month and day"></svg>
      <div id="tip" hidden></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
