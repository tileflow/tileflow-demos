packages:
  - 'apps/*'
  - '30-day-map-challenge-2026/*'

allowBuilds:
  sharp: true

# sdk-sync:start
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@tileflow/capture@0.1.0-alpha.44'
  - '@tileflow/coordinates@0.1.0-alpha.5'
  - '@tileflow/coordinates-runtime@0.1.0-alpha.8'
  - '@tileflow/core@0.1.0-alpha.57'
  - '@tileflow/dev@0.1.0-alpha.51'
  - '@tileflow/dom@0.1.0-alpha.7'
  - '@tileflow/interactions@0.1.0-alpha.14'
  - '@tileflow/maps@0.1.0-alpha.27'
  - '@tileflow/next@0.1.0-alpha.29'
  - '@tileflow/react@0.1.0-alpha.45'
  - '@tileflow/static@0.1.0-alpha.34'
  - '@tileflow/vite@0.1.0-alpha.30'
  - 'tileflow@0.1.0-alpha.30'
# sdk-sync:end

# Align the renderer pinned by the published Tileflow tooling.
overrides:
  maplibre-gl@6.13.0: 6.16.0
