packages:
  - 'apps/*'

allowBuilds:
  sharp: true

# sdk-sync:start
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@tileflow/capture@0.1.0-alpha.37'
  - '@tileflow/coordinates@0.1.0-alpha.3'
  - '@tileflow/coordinates-runtime@0.1.0-alpha.6'
  - '@tileflow/core@0.1.0-alpha.44'
  - '@tileflow/dev@0.1.0-alpha.40'
  - '@tileflow/interactions@0.1.0-alpha.7'
  - '@tileflow/maps@0.1.0-alpha.17'
  - '@tileflow/next@0.1.0-alpha.25'
  - '@tileflow/react@0.1.0-alpha.36'
  - '@tileflow/static@0.1.0-alpha.29'
  - '@tileflow/vite@0.1.0-alpha.26'
  - 'tileflow@0.1.0-alpha.19'
# sdk-sync:end

# Align the renderer pinned by the published Tileflow tooling.
overrides:
  maplibre-gl@6.13.0: 6.16.0
